<!--
  Obujtese.cz – „důvěryhodnostní" pás do patičky
  Vložte celý tento blok (včetně <style>) do Shoptet do HTML/textového pole patičky
  (Vzhled webu → Upravit vzhled → patička → blok „Vlastní HTML", nebo přímo
  do stávajícího textového pole patičky, kam jde i aktuální úvodní text).

  Vše je schované pod #ob-usp-footer, takže styly NEOVLIVNÍ zbytek e-shopu
  (žádný globální reset, žádné selektory na "a", "p", "h2" apod. mimo tento blok).

  Vizuální styl (černobílé liniové ikony, verzálky, tenké dělicí linky)
  navazuje na stávající ikony USP na webu (výměna a vrácení / doprava zdarma /
  rychlé odeslání / bezpečný nákup).
-->
<div id="ob-usp-footer">
  <style>
    #ob-usp-footer {
      --ob-ink: #1a1a1a;
      --ob-muted: #6f6f6f;
      --ob-line: #e3e3e3;

      box-sizing: border-box;
      max-width: 1200px;
      margin: 32px auto;
      font-family: inherit;
      color: var(--ob-ink);
    }
    #ob-usp-footer *,
    #ob-usp-footer *::before,
    #ob-usp-footer *::after {
      box-sizing: inherit;
    }

    #ob-usp-footer .ob-usp-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--ob-line);
      border-bottom: 1px solid var(--ob-line);
    }
    @media (max-width: 700px) {
      #ob-usp-footer .ob-usp-bar { grid-template-columns: repeat(2, 1fr); }
    }

    #ob-usp-footer .ob-usp-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 18px;
      border-left: 1px solid var(--ob-line);
    }
    #ob-usp-footer .ob-usp-item:first-child {
      border-left: none;
    }
    @media (max-width: 700px) {
      #ob-usp-footer .ob-usp-item {
        border-left: none;
        border-top: 1px solid var(--ob-line);
      }
      #ob-usp-footer .ob-usp-item:nth-child(odd) {
        border-right: 1px solid var(--ob-line);
      }
      #ob-usp-footer .ob-usp-item:nth-child(-n+2) {
        border-top: none;
      }
    }

    #ob-usp-footer .ob-usp-icon {
      flex: none;
      width: 30px;
      height: 30px;
      color: var(--ob-ink);
    }
    #ob-usp-footer .ob-usp-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #ob-usp-footer .ob-usp-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.3;
      margin: 0 0 3px 0;
    }
    #ob-usp-footer .ob-usp-desc {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ob-muted);
      margin: 0;
      line-height: 1.3;
    }

    #ob-usp-footer .ob-reviews {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 20px 4px;
    }
    #ob-usp-footer .ob-reviews-text {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #ob-usp-footer .ob-reviews-icon {
      flex: none;
      width: 28px;
      height: 28px;
      color: var(--ob-ink);
    }
    #ob-usp-footer .ob-reviews-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* místo pro oficiální Heureka widget "Ověřeno zákazníky" (natáhne se sám ze
       stávajícího embed skriptu Heureky, tady mu jen dáme hezké zarovnání) */
    #ob-usp-footer #hodnoceniobchodu {
      border: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 30px;
    }
  </style>

  <div class="ob-usp-bar">
    <div class="ob-usp-item">
      <span class="ob-usp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </span>
      <div>
        <p class="ob-usp-title">30+ let na trhu</p>
        <p class="ob-usp-desc">Prodáváme obuv od roku 1993</p>
      </div>
    </div>

    <div class="ob-usp-item">
      <span class="ob-usp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 11v8H4.5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1H7z"/><path d="M7 11l3.2-6.6c1.1 0 2.3.9 2.3 2.2V9h4.7a2 2 0 0 1 2 2.3l-.9 5.7A2 2 0 0 1 17.3 19H7"/></svg>
      </span>
      <div>
        <p class="ob-usp-title">98 % nás doporučuje</p>
        <p class="ob-usp-desc">Podle hodnocení zákazníků</p>
      </div>
    </div>

    <div class="ob-usp-item">
      <span class="ob-usp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5z"/><path d="M3 7.5V16l9 4.5 9-4.5V7.5"/><path d="M12 12v8.5"/></svg>
      </span>
      <div>
        <p class="ob-usp-title">Doprava zdarma</p>
        <p class="ob-usp-desc">Při nákupu nad 1000 Kč</p>
      </div>
    </div>

    <div class="ob-usp-item">
      <span class="ob-usp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21 3 10.5 13.5"/><path d="M21 3 14 21l-3.5-7.5L3 10z"/></svg>
      </span>
      <div>
        <p class="ob-usp-title">Expedice do 24h</p>
        <p class="ob-usp-desc">Skladem, v pracovní dny</p>
      </div>
    </div>
  </div>

  <div class="ob-reviews">
    <div class="ob-reviews-text">
      <span class="ob-reviews-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><polygon points="12,3 14.9,9.1 21.5,9.9 16.8,14.4 18,21 12,17.7 6,21 7.2,14.4 2.5,9.9 9.1,9.1"/></svg>
      </span>
      <div>
        <p class="ob-usp-title">Hodnocení zákazníků</p>
        <p class="ob-usp-desc">Podívejte se, co o nás říkají</p>
      </div>
    </div>
    <!-- sem se natáhne stávající widget hodnocení (Heureka / Zboží.cz) -->
    <div id="hodnoceniobchodu"></div>
  </div>
</div>
