<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Banner Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ui-bg: #0f0f12;
      --ui-panel: #1a1a22;
      --ui-border: #2e2e3a;
      --ui-text: #e8e8f0;
      --ui-muted: #888898;
      --ui-accent: #6c63ff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--ui-bg);
      color: var(--ui-text);
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar controls ── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--ui-panel);
      border-right: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--ui-border);
    }

    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--ui-text);
    }

    .sidebar-header p {
      font-size: 11px;
      color: var(--ui-muted);
      margin-top: 4px;
    }

    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--ui-border);
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ui-muted);
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #aaaabc;
      margin-bottom: 5px;
    }

    .field input[type="text"],
    .field input[type="number"],
    .field select,
    .field textarea {
      width: 100%;
      background: #13131a;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      color: var(--ui-text);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input[type="text"]:focus,
    .field input[type="number"]:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--ui-accent);
    }

    .field textarea { resize: vertical; min-height: 56px; }

    .color-row {
      display: flex;
      gap: 8px;
    }

    .color-field {
      flex: 1;
    }

    .color-field label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: #aaaabc;
      margin-bottom: 5px;
    }

    .color-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #13131a;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      padding: 4px 8px;
    }

    .color-input-wrap input[type="color"] {
      width: 24px;
      height: 24px;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      border-radius: 4px;
    }

    .color-input-wrap input[type="text"] {
      background: transparent;
      border: none;
      color: var(--ui-text);
      font-size: 11px;
      padding: 0;
      width: 100%;
    }

    .toggle-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      background: #13131a;
      border: 1px solid var(--ui-border);
      color: var(--ui-muted);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--ui-accent);
      border-color: var(--ui-accent);
      color: #fff;
    }

    .btn-generate {
      width: calc(100% - 40px);
      margin: 16px 20px;
      background: var(--ui-accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-generate:hover { background: #7c74ff; }
    .btn-generate:active { transform: scale(0.98); }

    /* ── Main canvas area ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 48px;
      background: #080810;
    }

    .format-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .format-label {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .format-label h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--ui-text);
    }

    .format-label .dims {
      font-size: 11px;
      color: var(--ui-muted);
      background: #1a1a22;
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      padding: 2px 8px;
    }

    .banner-frame {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transform-origin: top left;
    }

    .canvas-wrap {
      overflow: auto;
      max-width: 100%;
    }

    /* ── Banner internal styles (injected via JS) ── */
    .banner-inner {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* Layout: split */
    .layout-split .banner-left {
      width: 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
      z-index: 2;
      position: relative;
    }

    .layout-split .banner-right {
      width: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Layout: centered */
    .layout-center {
      justify-content: center;
      align-items: center;
    }

    .layout-center .banner-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10%;
      z-index: 2;
      position: relative;
      width: 100%;
    }

    /* Layout: story (tall) */
    .layout-story .banner-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 8%;
      padding-bottom: 12%;
      z-index: 2;
      position: relative;
      width: 100%;
    }

    /* Layout: cover (wide) */
    .layout-cover {
      align-items: center;
    }

    .layout-cover .banner-left {
      width: 60%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5% 6%;
      z-index: 2;
    }

    .layout-cover .banner-right {
      width: 40%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* bg shapes */
    .bg-shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* text elements */
    .b-eyebrow {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.5em;
    }

    .b-headline {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.4em;
    }

    .b-headline em { font-style: italic; }

    .b-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.5;
      margin-bottom: 1.2em;
    }

    .b-cta {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      white-space: nowrap;
    }

    .b-logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      position: absolute;
      z-index: 10;
    }

    .b-badge {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5;
      font-family: 'Inter', sans-serif;
    }

    .b-badge .big { font-weight: 800; line-height: 1; }
    .b-badge .small { font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

    .b-shoe {
      filter: drop-shadow(0 8% 5% rgba(0,0,0,0.3));
    }

    .b-shoe-anim {
      animation: shoeFloat 3s ease-in-out infinite;
    }

    @keyframes shoeFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-5%) rotate(-5deg); }
    }

    .b-perks {
      display: flex;
      align-items: center;
      gap: 1em;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .b-perk {
      display: flex;
      align-items: center;
      gap: 0.3em;
      white-space: nowrap;
    }

    .b-perk::before {
      content: '✓';
      font-weight: 700;
    }

    /* Scale wrapper */
    .scale-wrap {
      width: 100%;
      overflow: auto;
    }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>FB Banner Generator</h1>
    <p>Generátor sad Facebook bannerů</p>
  </div>

  <div class="section">
    <div class="section-title">Brand</div>
    <div class="field">
      <label>Název / Logo text</label>
      <input type="text" id="brandName" value="Obujtese.cz" />
    </div>
    <div class="field">
      <label>Slogan (eyebrow)</label>
      <input type="text" id="eyebrow" value="Nová kolekce 2025" />
    </div>
    <div class="field">
      <label>Hlavní nadpis</label>
      <input type="text" id="headline" value="Každý krok je příběh" />
    </div>
    <div class="field">
      <label>Kurzíva část nadpisu (nepovinné)</label>
      <input type="text" id="headlineItalic" value="příběh" />
    </div>
    <div class="field">
      <label>Podnadpis</label>
      <textarea id="sub">Prémiová obuv pro ženy, které vědí, co chtějí.</textarea>
    </div>
    <div class="field">
      <label>Text tlačítka</label>
      <input type="text" id="cta" value="Prohlédnout kolekci" />
    </div>
  </div>

  <div class="section">
    <div class="section-title">Barvy</div>
    <div class="color-row">
      <div class="color-field">
        <label>Pozadí</label>
        <div class="color-input-wrap">
          <input type="color" id="colorBg" value="#1a1018" oninput="syncHex(this,'colorBgHex')" />
          <input type="text" id="colorBgHex" value="#1a1018" oninput="syncColor(this,'colorBg')" />
        </div>
      </div>
      <div class="color-field">
        <label>Akcent</label>
        <div class="color-input-wrap">
          <input type="color" id="colorAccent" value="#c49a6c" oninput="syncHex(this,'colorAccentHex')" />
          <input type="text" id="colorAccentHex" value="#c49a6c" oninput="syncColor(this,'colorAccent')" />
        </div>
      </div>
    </div>
    <div class="color-row" style="margin-top:8px">
      <div class="color-field">
        <label>Hlavní text</label>
        <div class="color-input-wrap">
          <input type="color" id="colorText" value="#faf8f5" oninput="syncHex(this,'colorTextHex')" />
          <input type="text" id="colorTextHex" value="#faf8f5" oninput="syncColor(this,'colorText')" />
        </div>
      </div>
      <div class="color-field">
        <label>Vedlejší text</label>
        <div class="color-input-wrap">
          <input type="color" id="colorSub" value="#b0a89e" oninput="syncHex(this,'colorSubHex')" />
          <input type="text" id="colorSubHex" value="#b0a89e" oninput="syncColor(this,'colorSub')" />
        </div>
      </div>
    </div>
    <div class="color-row" style="margin-top:8px">
      <div class="color-field">
        <label>CTA text</label>
        <div class="color-input-wrap">
          <input type="color" id="colorCtaText" value="#1a1018" oninput="syncHex(this,'colorCtaTextHex')" />
          <input type="text" id="colorCtaTextHex" value="#1a1018" oninput="syncColor(this,'colorCtaText')" />
        </div>
      </div>
      <div class="color-field">
        <label>CTA pozadí</label>
        <div class="color-input-wrap">
          <input type="color" id="colorCtaBg" value="#c49a6c" oninput="syncHex(this,'colorCtaBgHex')" />
          <input type="text" id="colorCtaBgHex" value="#c49a6c" oninput="syncColor(this,'colorCtaBg')" />
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Výprodej badge (nepovinné)</div>
    <div class="field">
      <label>Sleva (např. "50%", nechej prázdné = vypnout)</label>
      <input type="text" id="saleBadge" value="" placeholder="50%" />
    </div>
  </div>

  <div class="section">
    <div class="section-title">Benefity (max 3, oddělené |)</div>
    <div class="field">
      <input type="text" id="perks" value="Doprava zdarma|Vrácení 14 dní|Doručení 3 dny" />
    </div>
  </div>

  <div class="section">
    <div class="section-title">Formáty</div>
    <div class="toggle-row" id="formatToggles">
      <button class="toggle-btn active" data-format="feed">Feed 1200×628</button>
      <button class="toggle-btn active" data-format="square">Čtverec 1080×1080</button>
      <button class="toggle-btn active" data-format="story">Story 1080×1920</button>
      <button class="toggle-btn active" data-format="cover">Cover 820×312</button>
      <button class="toggle-btn active" data-format="event">Event 1920×1005</button>
    </div>
  </div>

  <button class="btn-generate" onclick="generateAll()">Generovat bannery</button>
</aside>

<!-- ── MAIN ── -->
<main class="main" id="main">
  <div style="color:#555; font-size:13px; text-align:center; padding-top:40px">
    Klikni na <strong style="color:#fff">Generovat bannery</strong> pro náhled všech formátů.
  </div>
</main>

<script>
  /* ── helpers ── */
  function syncHex(colorPicker, hexId) {
    document.getElementById(hexId).value = colorPicker.value;
  }
  function syncColor(hexInput, colorId) {
    const v = hexInput.value;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById(colorId).value = v;
  }

  function v(id) { return document.getElementById(id).value.trim(); }

  /* format toggles */
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });

  /* ── banner data ── */
  const FORMATS = {
    feed:   { label: 'Feed reklama',      w: 1200, h: 628,  layout: 'split',  scale: 0.5 },
    square: { label: 'Čtverec',           w: 1080, h: 1080, layout: 'center', scale: 0.4 },
    story:  { label: 'Story / Reels',     w: 1080, h: 1920, layout: 'story',  scale: 0.28 },
    cover:  { label: 'Cover fotka',       w: 820,  h: 312,  layout: 'cover',  scale: 0.65 },
    event:  { label: 'Event cover',       w: 1920, h: 1005, layout: 'split',  scale: 0.4 },
  };

  /* ── shoe SVG ── */
  function shoeSVG(size, accent) {
    const s = size;
    return `<svg width="${s}" height="${s*0.85}" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="b-shoe b-shoe-anim">
      <path d="M190 155 L195 185 Q196 190 191 191 L183 192 Q178 192 178 187 L180 155 Z" fill="${accent}" opacity="0.9"/>
      <path d="M40 155 Q30 156 28 162 Q26 170 35 173 L185 173 Q195 173 195 165 L190 155 Z" fill="${shadeHex(accent,-40)}"/>
      <path d="M185 155 Q190 100 160 70 Q140 50 110 48 Q80 46 55 60 Q30 74 30 90 Q30 110 50 125 Q70 138 100 145 Q130 150 160 152 Z"
            fill="url(#sg${s})"/>
      <path d="M30 90 Q24 95 22 105 Q21 115 30 120 Q40 124 50 122 Q38 115 36 102 Q34 94 30 90 Z" fill="${shadeHex(accent,-60)}" opacity="0.8"/>
      <path d="M160 70 Q170 85 178 105 Q184 120 185 140" stroke="${lightenHex(accent,40)}" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
      <defs>
        <linearGradient id="sg${s}" x1="30" y1="48" x2="185" y2="155" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="${lightenHex(accent,15)}"/>
          <stop offset="50%" stop-color="${accent}"/>
          <stop offset="100%" stop-color="${shadeHex(accent,-30)}"/>
        </linearGradient>
      </defs>
    </svg>`;
  }

  /* ── color utils ── */
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }
  function rgbToHex(r,g,b) {
    return '#' + [r,g,b].map(x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
  }
  function shadeHex(hex, amt) {
    const [r,g,b] = hexToRgb(hex);
    return rgbToHex(r+amt, g+amt, b+amt);
  }
  function lightenHex(hex, amt) { return shadeHex(hex, amt); }

  function bgGradient(bg, accent) {
    const [r,g,b] = hexToRgb(accent);
    return `linear-gradient(135deg, ${bg} 0%, ${shadeHex(bg,8)} 100%)`;
  }

  /* ── bg shapes SVG ── */
  function bgShapes(w, h, accent) {
    const [r,g,b] = hexToRgb(accent);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
      <defs>
        <radialGradient id="rg1" cx="80%" cy="30%" r="50%">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="rg2" cx="20%" cy="80%" r="40%">
          <stop offset="0%" stop-color="${lightenHex(accent,30)}" stop-opacity="0.07"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="${w}" height="${h}" fill="url(#rg1)"/>
      <rect width="${w}" height="${h}" fill="url(#rg2)"/>
      <circle cx="${w*0.85}" cy="${h*0.15}" r="${Math.min(w,h)*0.25}" fill="${accent}" opacity="0.05"/>
    </svg>`;
  }

  /* ── build banner HTML ── */
  function buildBanner(fmt, cfg) {
    const { w, h, layout } = fmt;
    const { bg, accent, textColor, subColor, ctaBg, ctaText, brandName, eyebrow, headline, headlineItalic, sub, cta, saleBadge, perks } = cfg;

    const fs = (base) => `${(base * Math.min(w, h) / 600).toFixed(1)}px`;

    const headlineHtml = headlineItalic && headline.includes(headlineItalic)
      ? headline.replace(headlineItalic, `<em style="color:${accent}">${headlineItalic}</em>`)
      : headline;

    const perksHtml = perks.length
      ? `<div class="b-perks" style="font-size:${fs(11)};color:${subColor};gap:${fs(14)};flex-wrap:wrap;">
          ${perks.map(p => `<span class="b-perk">&nbsp;${p}</span>`).join('')}
        </div>`
      : '';

    const badgeHtml = saleBadge
      ? `<div class="b-badge" style="
          width:${fs(80)};height:${fs(80)};
          background:${accent};
          top:${fs(20)};right:${fs(20)};
          font-size:${fs(11)};
          color:${ctaText};">
          <span class="big" style="font-size:${fs(26)}">${saleBadge}</span>
          <span class="small" style="font-size:${fs(8)}">sleva</span>
         </div>`
      : '';

    const shoeSize = Math.min(w, h) * 0.55;
    const shoe = shoeSVG(shoeSize, accent);

    const logoHtml = `<div class="b-logo" style="
      top:${fs(18)};left:${fs(22)};
      font-size:${fs(13)};
      color:${accent};">${brandName}</div>`;

    const textBlock = (gap='') => `
      <div style="font-size:${fs(10)};font-weight:600;letter-spacing:3px;text-transform:uppercase;color:${accent};margin-bottom:${fs(8)}">${eyebrow}</div>
      <div class="b-headline" style="font-size:${fs(44)};color:${textColor};margin-bottom:${fs(8)}">${headlineHtml}</div>
      <div class="b-sub" style="font-size:${fs(13)};color:${subColor};margin-bottom:${fs(20)}">${sub}</div>
      ${perksHtml}
      <div style="margin-top:${fs(20)}">
        <div class="b-cta" style="background:${ctaBg};color:${ctaText};font-size:${fs(11)};padding:${fs(13)} ${fs(24)};">${cta}</div>
      </div>`;

    let inner = '';

    if (layout === 'split') {
      inner = `
        <div class="layout-split banner-inner" style="background:${bgGradient(bg, accent)}">
          ${bgShapes(w, h, accent)}
          ${logoHtml}
          ${badgeHtml}
          <div class="banner-left">${textBlock()}</div>
          <div class="banner-right" style="position:relative">${shoe}</div>
        </div>`;
    } else if (layout === 'center') {
      inner = `
        <div class="layout-center banner-inner" style="background:${bgGradient(bg, accent)}">
          ${bgShapes(w, h, accent)}
          ${logoHtml}
          ${badgeHtml}
          <div style="position:absolute;right:5%;top:50%;transform:translateY(-50%);opacity:0.15;pointer-events:none">${shoeSVG(h*0.7, accent)}</div>
          <div class="banner-center">${textBlock()}</div>
        </div>`;
    } else if (layout === 'story') {
      const storyText = `
        <div style="font-size:${fs(10)};font-weight:600;letter-spacing:3px;text-transform:uppercase;color:${accent};margin-bottom:${fs(10)}">${eyebrow}</div>
        <div class="b-headline" style="font-size:${fs(52)};color:${textColor};margin-bottom:${fs(10)}">${headlineHtml}</div>
        <div class="b-sub" style="font-size:${fs(14)};color:${subColor};margin-bottom:${fs(24)}">${sub}</div>
        ${perksHtml}
        <div style="margin-top:${fs(24)}">
          <div class="b-cta" style="background:${ctaBg};color:${ctaText};font-size:${fs(12)};padding:${fs(15)} ${fs(32)};">${cta}</div>
        </div>`;
      inner = `
        <div class="layout-story banner-inner" style="background:${bgGradient(bg, accent)}">
          ${bgShapes(w, h, accent)}
          ${logoHtml}
          ${badgeHtml}
          <div style="position:absolute;top:8%;left:50%;transform:translateX(-50%)">${shoeSVG(w*0.7, accent)}</div>
          <div class="banner-center" style="flex-direction:column;align-items:center;text-align:center;padding-bottom:10%">${storyText}</div>
        </div>`;
    } else if (layout === 'cover') {
      inner = `
        <div class="layout-cover banner-inner" style="background:${bgGradient(bg, accent)}">
          ${bgShapes(w, h, accent)}
          ${badgeHtml}
          <div class="banner-left">
            <div style="font-family:'Playfair Display',serif;font-size:${fs(18)};font-weight:700;color:${accent};margin-bottom:${fs(6)}">${brandName}</div>
            <div class="b-headline" style="font-size:${fs(36)};color:${textColor};margin-bottom:${fs(8)}">${headlineHtml}</div>
            <div class="b-sub" style="font-size:${fs(12)};color:${subColor};margin-bottom:${fs(16)}">${sub}</div>
            <div class="b-cta" style="background:${ctaBg};color:${ctaText};font-size:${fs(10)};padding:${fs(10)} ${fs(20)};">${cta}</div>
          </div>
          <div class="banner-right">${shoeSVG(h*0.85, accent)}</div>
        </div>`;
    }

    return inner;
  }

  /* ── main generate ── */
  function generateAll() {
    const activeFormats = [...document.querySelectorAll('.toggle-btn.active')].map(b => b.dataset.format);
    const perksRaw = v('perks').split('|').map(s => s.trim()).filter(Boolean).slice(0, 3);

    const cfg = {
      bg:            v('colorBg'),
      accent:        v('colorAccent'),
      textColor:     v('colorText'),
      subColor:      v('colorSub'),
      ctaBg:         v('colorCtaBg'),
      ctaText:       v('colorCtaText'),
      brandName:     v('brandName'),
      eyebrow:       v('eyebrow'),
      headline:      v('headline'),
      headlineItalic:v('headlineItalic'),
      sub:           v('sub'),
      cta:           v('cta'),
      saleBadge:     v('saleBadge'),
      perks:         perksRaw,
    };

    const main = document.getElementById('main');
    main.innerHTML = '';

    activeFormats.forEach(fmtKey => {
      const fmt = FORMATS[fmtKey];
      if (!fmt) return;

      const block = document.createElement('div');
      block.className = 'format-block';

      const label = document.createElement('div');
      label.className = 'format-label';
      label.innerHTML = `
        <h3>${fmt.label}</h3>
        <span class="dims">${fmt.w} × ${fmt.h} px</span>
        <span class="dims" style="color:#6c63ff">${Math.round(fmt.scale * 100)}% náhled</span>`;
      block.appendChild(label);

      const scaleWrap = document.createElement('div');
      scaleWrap.className = 'scale-wrap';

      const frame = document.createElement('div');
      frame.className = 'banner-frame';
      frame.style.cssText = `width:${fmt.w}px;height:${fmt.h}px;transform:scale(${fmt.scale});transform-origin:top left;margin-bottom:${Math.round(fmt.h * fmt.scale - fmt.h)}px;`;

      frame.innerHTML = buildBanner(fmt, cfg);
      scaleWrap.appendChild(frame);
      block.appendChild(scaleWrap);
      main.appendChild(block);
    });
  }

  /* auto-generate on load */
  window.addEventListener('load', generateAll);
</script>
</body>
</html>
